name: validate-invest-frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Browser tests intercept the chat API; no backend or provider key is needed.
      PUBLIC_GIANNA_API_BASE: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: |
            reports/playwright/
            test-results/
