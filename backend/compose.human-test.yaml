# LOCAL HUMAN TEST ONLY. Use with compose.yaml, never in Coolify/production.
# Use a test-only installation whose DATABASE_URL points to an isolated MariaDB schema.
# The project name isolates the LanceDB volume, not the external MariaDB database.
name: gianna-invest-human-test
services:
  api:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      FLASK_ENV: development
      GIANNA_HUMAN_TEST_MODE: 'true'
      CORS_ORIGINS: http://localhost:4321,http://127.0.0.1:4321,http://localhost:8001,http://127.0.0.1:8001
    ports:
      - '127.0.0.1:8001:8000'
