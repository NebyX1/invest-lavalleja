name: gianna-invest
services:
  api:
    build: .
    restart: unless-stopped
    init: true
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL para el esquema MariaDB de Gianna}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS con los origenes del portal y la API}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-False}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
    expose:
      - '8000'
    volumes:
      - gianna_data:/app/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 35s
    healthcheck:
      test: ['CMD','curl','--fail','--silent','--show-error','--max-time','3','http://127.0.0.1:8000/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  gianna_data:
